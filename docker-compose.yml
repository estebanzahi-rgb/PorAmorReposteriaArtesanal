version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: poramor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: poramor_db
      POSTGRES_USER: poramor_user
      POSTGRES_PASSWORD: poramor_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poramor_user -d poramor_db']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: poramor_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@poramor.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
